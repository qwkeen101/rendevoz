<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rendevoz</title>
    <style>
        body {
            overflow: hidden;
        }
        #message{
            color: rgba(255, 255, 255, .65);
            font-size: 14px;
            margin-top: 100px;
            text-transform: capitalize;
        }
        #message::after{
            content: "...";
        }
        .scene {
            position: fixed;
            z-index: 9999999;
            inset: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            -webkit-app-region: drag;
            background: #191919;
        }
        .cube-wrapper {
            transform-style: preserve-3d;
            animation: bouncing 2s infinite;
        }
        .cube {
            transform-style: preserve-3d;
            transform: rotateX(45deg) rotateZ(45deg);
            animation: rotation 2s infinite;
        }
        .cube-faces {
            transform-style: preserve-3d;
            height: 60px;
            width: 60px;
            position: relative;
            transform-origin: 0 0;
            transform: translateX(0) translateY(0) translateZ(-40px);
        }
        .cube-face {
            position: absolute;
            inset: 0;
            background: white;
            border: 1px solid #191919;
        }
        .cube-face.shadow {
            transform: translateZ(-60px);
            animation: bouncing-shadow 2s infinite;
        }
        .cube-face.top {
            transform: translateZ(60px);
        }
        .cube-face.front {
            transform-origin: 0 50%;
            transform: rotateY(-90deg);
        }
        .cube-face.back {
            transform-origin: 0 50%;
            transform: rotateY(-90deg) translateZ(-60px);
        }
        .cube-face.right {
            transform-origin: 50% 0;
            transform: rotateX(-90deg) translateY(-60px);
        }
        .cube-face.left {
            transform-origin: 50% 0;
            transform: rotateX(-90deg) translateY(-60px) translateZ(60px);
        }
        @keyframes rotation {
            0% {
                transform: rotateX(45deg) rotateY(0) rotateZ(45deg);
                animation-timing-function: cubic-bezier(0.17, 0.84, 0.44, 1);
            }
            50% {
                transform: rotateX(45deg) rotateY(0) rotateZ(225deg);
                animation-timing-function: cubic-bezier(0.76, 0.05, 0.86, 0.06);
            }
            100% {
                transform: rotateX(45deg) rotateY(0) rotateZ(405deg);
                animation-timing-function: cubic-bezier(0.17, 0.84, 0.44, 1);
            }
        }
        @keyframes bouncing {
            0% {
                transform: translateY(-30px);
                animation-timing-function: cubic-bezier(0.76, 0.05, 0.86, 0.06);
            }
            45% {
                transform: translateY(30px);
                animation-timing-function: cubic-bezier(0.23, 1, 0.32, 1);
            }
            100% {
                transform: translateY(-30px);
                animation-timing-function: cubic-bezier(0.76, 0.05, 0.86, 0.06);
            }
        }
        @keyframes bouncing-shadow {
            0% {
                transform: translateZ(-40px) scale(1.3);
                animation-timing-function: cubic-bezier(0.76, 0.05, 0.86, 0.06);
                opacity: 0.05;
            }
            45% {
                transform: translateZ(0);
                animation-timing-function: cubic-bezier(0.23, 1, 0.32, 1);
                opacity: 0.3;
            }
            100% {
                transform: translateZ(-40px) scale(1.3);
                animation-timing-function: cubic-bezier(0.76, 0.05, 0.86, 0.06);
                opacity: 0.05;
            }
        }
    </style>
  </head>
  <body>
    <div id="root" class='h-screen w-screen relative flex overflow-hidden'></div>
    <div class="scene">
      <div class="cube-wrapper">
        <div class="cube">
          <div class="cube-faces">
            <div class="cube-face shadow"></div>
            <div class="cube-face bottom"></div>
            <div class="cube-face top"></div>
            <div class="cube-face left"></div>
            <div class="cube-face right"></div>
            <div class="cube-face back"></div>
            <div class="cube-face front"></div>
          </div>
        </div>
      </div>
      <div id='message'>Loading application resources</div>
    </div>
    <script>
      window.global = window
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
