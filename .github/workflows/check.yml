name: Check build

# Installs dependencies and runs the Vite build (renderer + Electron main/preload)
# on Linux and Windows. No packaging or signing; build.yml does releases.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # vite build does not need the Electron binary itself
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci installs exactly what package-lock.json says and fails if
      # package.json and the lockfile disagree. After changing dependencies,
      # run npm install locally and commit the updated lockfile.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Temporary: package.json dependency groups changed; hand the updated
      # lockfile back so it can be committed.
      - name: Upload lockfile
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json

      - name: Build
        run: npm run build
